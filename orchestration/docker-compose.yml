services:
  airflow-db:
    image: postgres:16
    container_name: retailflow_airflow_db
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_db_data:/var/lib/postgresql/data

  airflow-init:
    build:
      context: ..
      dockerfile: orchestration/Dockerfile
    image: retailflow-airflow:latest
    container_name: retailflow_airflow_init
    depends_on:
      - airflow-db
    env_file:
      - ../.env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      DBT_PROFILES_DIR: /opt/airflow/project/dbt_retailflow
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ..:/opt/airflow/project
    command: >
      bash -c "airflow db migrate &&
      airflow users create
      --username airflow
      --firstname Airflow
      --lastname Admin
      --role Admin
      --email airflow@example.com
      --password airflow"

  airflow-webserver:
    build:
      context: ..
      dockerfile: orchestration/Dockerfile
    image: retailflow-airflow:latest
    container_name: retailflow_airflow_webserver
    depends_on:
      - airflow-init
    env_file:
      - ../.env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      DBT_PROFILES_DIR: /opt/airflow/project/dbt_retailflow
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ..:/opt/airflow/project
    ports:
      - "8080:8080"
    command: webserver

  airflow-scheduler:
    build:
      context: ..
      dockerfile: orchestration/Dockerfile
    image: retailflow-airflow:latest
    container_name: retailflow_airflow_scheduler
    depends_on:
      - airflow-init
    env_file:
      - ../.env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      DBT_PROFILES_DIR: /opt/airflow/project/dbt_retailflow
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ..:/opt/airflow/project
    command: scheduler

volumes:
  airflow_db_data: